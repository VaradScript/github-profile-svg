<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate GitHub Trophy Preview - 9 Modes</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        h1 {
            margin-bottom: 20px;
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px;
        }

        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .mode-section {
            background: #161b22;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
        }

        h2 {
            margin-top: 0;
            color: #58a6ff;
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 1px;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>Ultimate Trophy Preview (14 Categories)</h1>
    <div class="preview-container">
        <div class="mode-section">
            <h2>Glass Mode</h2><img src="test-glass.svg">
        </div>
        <div class="mode-section">
            <h2>Terminal Mode</h2><img src="test-terminal.svg">
        </div>
        <div class="mode-section">
            <h2>Minecraft Mode</h2><img src="test-minecraft.svg">
        </div>
        <div class="mode-section">
            <h2>Cyberpunk Mode</h2><img src="test-cyberpunk.svg">
        </div>
        <div class="mode-section">
            <h2>Traditional Mode</h2><img src="test-traditional.svg">
        </div>
        <div class="mode-section">
            <h2>Unreal Mode</h2><img src="test-unreal.svg">
        </div>
        <div class="mode-section">
            <h2>Nostalgic Mode</h2><img src="test-nostalgic.svg">
        </div>
        <div class="mode-section">
            <h2>Sketch Mode</h2><img src="test-sketch.svg">
        </div>
        <div class="mode-section">
            <h2>2D Mode</h2><img src="test-2d.svg">
        </div>
    </div>
</body>

</html>
