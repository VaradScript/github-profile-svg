<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Trophy Modes Preview</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        h1 { margin-bottom: 20px; }
        .preview-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .mode-section {
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h2 { margin-top: 0; color: #58a6ff; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
        .description { font-size: 14px; color: #8b949e; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>GitHub Trophy System Preview</h1>
    
    <div class="preview-container">
        <div class="mode-section">
            <h2>Mode: Unreal</h2>
            <p class="description">Premium look with glows, gradients, and glassmorphism cards.</p>
            <img src="test-unreal.svg" alt="Unreal Mode">
        </div>

        <div class="mode-section">
            <h2>Mode: Nostalgic</h2>
            <p class="description">Retro look with pixel art trophies and CRT scanlines.</p>
            <img src="test-nostalgic.svg" alt="Nostalgic Mode">
        </div>

        <div class="mode-section">
            <h2>Mode: 2D (Classic)</h2>
            <p class="description">Clean, flat design for a minimalist profile.</p>
            <img src="test-2d.svg" alt="2D Mode">
        </div>
    </div>
</body>
</html>
